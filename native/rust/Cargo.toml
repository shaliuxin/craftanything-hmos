[package]
name = "craftanything-hmos"
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "craftanything_hmos"
crate-type = ["staticlib"]

[dependencies]
egui = { version = "0.37", path = "../../vendor/egui/crates/egui" }
egui-wgpu = { version = "0.37", path = "../../vendor/egui/crates/egui-wgpu" }
# GLES/EGL 后端是鸿蒙 NDK 能直接用的那套；丢 gles 鸿蒙就没渲染后端（与 PhotoCraft 同源教训）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "gles"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"

# 上游纯 Rust 分析内核（零 C 依赖 / 零 eframe / 零子进程，OHOS 安全）
craft-anything-evidence = { path = "../../../_upstream/crates/evidence" }
craft-anything-formats = { path = "../../../_upstream/crates/formats" }
craft-anything-disasm = { path = "../../../_upstream/crates/disasm" }
craft-anything-js = { path = "../../../_upstream/crates/js" }
craft-anything-analysis = { path = "../../../_upstream/crates/analysis" }
# 完整上游 UI（CraftApp + 320 工具界面，通过 eframe stub 在 OHOS 上编译）
craft-anything-ui-egui = { path = "../../../_upstream/crates/ui-egui" }
craft-anything-engine = { path = "../../../_upstream/crates/engine" }
craft-anything-ai = { path = "../../../_upstream/crates/ai" }
eframe = { path = "../../vendor/eframe" }

# wgpu-hal 用带 GLES uniform-block 修补的 30.0.1，目录不存在即报错（不悄悄用旧的）。
[patch.crates-io]
wgpu-hal = { path = "../../third_party/wgpu-hal-30.0.1" }
egui = { path = "../../vendor/egui/crates/egui" }
egui-wgpu = { path = "../../vendor/egui/crates/egui-wgpu" }
# eframe / rfd / arboard → 最小 stub（OHOS 无窗口系统/无原生对话框/无跨进程剪贴板）
eframe = { path = "../../vendor/eframe" }
rfd = { path = "../../vendor/rfd-stub" }
arboard = { path = "../../vendor/arboard-stub" }

[workspace]
